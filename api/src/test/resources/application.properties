spring.datasource.url=jdbc:h2:mem:helpdesk-test;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=test-jwt-secret-with-at-least-32-bytes
app.jwt.expiration=30m

app.ai.groq.enabled=false
app.ai.groq.api-key=
app.ai.groq.base-url=https://api.groq.com/openai/v1
app.ai.groq.model=openai/gpt-oss-20b
app.ai.groq.timeout=3s
