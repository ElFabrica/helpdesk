spring.application.name=api
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/helpdesk}
spring.datasource.username=${POSTGRES_USER:helpdesk}
spring.datasource.password=${POSTGRES_PASSWORD:helpdesk}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=30m

app.ai.groq.enabled=${GROQ_CLASSIFIER_ENABLED:true}
app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
app.ai.groq.timeout=${GROQ_TIMEOUT:3s}
